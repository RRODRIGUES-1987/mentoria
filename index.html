<!-- Mentoria App | v1.2.1 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Mentoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<!-- ============================= AUTH ============================= -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-logo-icon">M</div>
      <div class="auth-logo-name">Mentor<span>ia</span></div></div>
    <div class="auth-title" id="auth-title">Bem-vindo de volta</div>
    <div class="auth-sub" id="auth-sub">Acesse para gerir seus programas de mentoria.</div>
    <div class="msg msg-err" id="auth-msg"></div>
    <div class="fg"><label class="fl">E-mail</label>
      <input class="fi" id="auth-email" type="email" placeholder="voce@exemplo.com" autocomplete="email"></div>
    <div class="fg"><label class="fl">Senha</label>
      <input class="fi" id="auth-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-full" id="auth-submit">Entrar</button>
    <div class="auth-switch"><span id="auth-toggle-text">Ainda não tem conta?</span>
      <button id="auth-toggle-btn">Criar conta</button></div>
  </div>
</div>

<!-- ============================= APP ============================= -->
<div id="app" class="app hidden">
  <nav class="bottomnav" id="sidenav">
    <div class="sidebar-logo">
      <div class="sidebar-logo-top"><div class="sidebar-logo-icon">M</div>Mentoria<span class="ver-badge" title="">v—</span></div>
    </div>
    <div id="sidebar-scroll">
      <button class="navitem" data-view="contacts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
        <span>Contatos</span>
      </button>
      <button class="navitem" data-view="programs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Mentorias</span>
      </button>
      <button class="navitem" data-view="evaluations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>Avaliações</span>
      </button>
      <button class="navitem" data-view="billings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span>Faturas</span>
      </button>
      <button class="navitem hidden" data-view="admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Admin</span>
      </button>
    </div>
    <div class="sbuser">
      <div class="sbuserchip"><div class="sbuav" id="sb-avatar">?</div>
        <div class="sbuinfo"><div class="sbuname" id="user-email">—</div><div class="sburole">Mentor</div></div></div>
      <button class="navitem" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sair</span>
      </button>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div class="logo">Mentor<span>ia</span> <span class="ver-badge" title="">v—</span></div>
      <div class="user-chip" id="logout-mobile"><div class="uav" id="tb-avatar">?</div>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
    </div>
    <div class="dtopbar">
      <div class="dtitle" id="dtitle">Mentorias</div>
    </div>
    <div class="content" id="content">
      <div id="view-contacts"    class="view"></div>
      <div id="view-programs"    class="view hidden"></div>
      <div id="view-evaluations" class="view hidden"></div>
      <div id="view-billings"    class="view hidden"></div>
      <div id="view-program-detail" class="view hidden"></div>
      <div id="view-contact-detail" class="view hidden"></div>
      <div id="view-admin" class="view hidden"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
