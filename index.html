<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentoria · Gestão de Programas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============================= AUTH ============================= -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark">Mentor<span class="dot">.</span>ia</span></div>
    <h1 id="auth-title">Bem-vindo de volta</h1>
    <p class="sub" id="auth-sub">Acesse para gerir seus programas de mentoria.</p>

    <div class="field">
      <label for="auth-email">E-mail</label>
      <input id="auth-email" type="email" autocomplete="email" placeholder="voce@exemplo.com">
    </div>
    <div class="field">
      <label for="auth-pass">Senha</label>
      <input id="auth-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button id="auth-submit" class="btn primary" style="width:100%">Entrar</button>
    <div id="auth-msg" class="auth-msg"></div>

    <div class="auth-toggle">
      <span id="auth-toggle-text">Ainda não tem conta?</span>
      <button id="auth-toggle-btn">Criar conta</button>
    </div>
  </div>
</div>

<!-- ============================= APP ============================= -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <span class="brand-mark">Mentor<span class="dot">.</span>ia</span>
    <button class="nav-item active" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="lbl">Painel</span>
    </button>
    <button class="nav-item" data-view="contacts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span class="lbl">Contatos</span>
    </button>
    <button class="nav-item" data-view="programs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span class="lbl">Mentorias</span>
    </button>
    <button class="nav-item" data-view="evaluations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <span class="lbl">Avaliações</span>
    </button>
    <button class="nav-item" data-view="billings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span class="lbl">Faturamento</span>
    </button>
    <div class="footer">
      <div class="user-email" id="user-email"></div>
      <button class="nav-item" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="lbl">Sair</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div id="view-dashboard"   class="view"></div>
    <div id="view-contacts"    class="view hidden"></div>
    <div id="view-programs"    class="view hidden"></div>
    <div id="view-evaluations" class="view hidden"></div>
    <div id="view-billings"    class="view hidden"></div>
    <div id="view-program-detail" class="view hidden"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
